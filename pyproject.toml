[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rltune"
version = "0.1.0"
description = "A hands-on PyTorch lab for post-training and RL harness operations"
requires-python = ">=3.11"
dependencies = ["torch>=2.6,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
prime = ["verifiers @ git+https://github.com/PrimeIntellect-ai/verifiers@897dd5f84bb8745e2f6705bcacf0f919ed8ce40c"]

[project.scripts]
rltune = "rltune.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.metadata]
allow-direct-references = true

# Keep the CPU teaching lab from downloading CUDA libraries on Linux.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
